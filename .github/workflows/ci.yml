name: CI
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -B --no-transfer-progress clean verify
      - run: docker build --tag local/nhs-jobs-gateway:ci .
