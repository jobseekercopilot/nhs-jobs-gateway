spring:
  application:
    name: nhs-jobs-gateway

server:
  port: ${SERVER_PORT:8104}
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

external-provider:
  mode: ${EXTERNAL_PROVIDER_MODE:FIXTURE}

nhs-jobs:
  base-url: ${NHS_JOBS_BASE_URL:https://www.jobs.nhs.uk}
  search-path: ${NHS_JOBS_SEARCH_PATH:/api/v1/search_xml}
  enabled: ${NHS_JOBS_ENABLED:true}
  connect-timeout: ${NHS_JOBS_CONNECT_TIMEOUT:2s}
  read-timeout: ${NHS_JOBS_READ_TIMEOUT:5s}
  max-response-bytes: ${NHS_JOBS_MAX_RESPONSE_BYTES:2097152}
  results-per-page: ${NHS_JOBS_RESULTS_PER_PAGE:50}

fixture:
  dataset-id: ${FIXTURE_DATASET_ID:nhs-jobs-checkpoint}
  dataset-version: ${FIXTURE_DATASET_VERSION:1.0.0}
  scenario: ${FIXTURE_SCENARIO:DEMO_READY}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%X{serviceName}] [%thread] %logger{36} - %msg%n"
  level:
    root: INFO
    com.jobseekercopilot: ${APP_LOG_LEVEL:INFO}
    org.springframework.web: WARN
